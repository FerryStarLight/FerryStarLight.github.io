<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人导航</title>
  <meta name="description" content="一个简洁、快速、可扩展的个人导航主页。" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f6f7fb" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%234f6ef7'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./assets/style.css" />

  <!-- 在样式加载前确定主题，避免深色模式下的白屏闪烁 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('nav-theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0e17' : '#f6f7fb');
      } catch (e) { /* 隐私模式下 localStorage 不可用，忽略即可 */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="bg" aria-hidden="true"></div>

  <main id="main" class="shell">
    <header id="hero" class="hero"></header>

    <div id="searchWrap" class="search-wrap">
      <div class="searchbar" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" />
          <path d="m16.2 16.2 4.3 4.3" />
        </svg>
        <input
          id="search"
          class="search-input"
          type="search"
          placeholder="搜索站点、描述或网址…"
          aria-label="搜索站点"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <button id="searchClear" class="search-clear" type="button" aria-label="清空搜索" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
      </div>
    </div>

    <p id="searchStatus" class="sr-only" role="status" aria-live="polite"></p>
    <div id="sections" class="sections"></div>

    <div id="empty" class="empty" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="m16.2 16.2 4.3 4.3" /></svg>
      </div>
      <p class="empty-title">没有找到匹配的站点</p>
      <p id="emptyHint" class="empty-hint"></p>
      <button id="emptyReset" class="button-ghost" type="button">清空搜索</button>
    </div>

    <footer id="footer" class="footer"></footer>
  </main>

  <noscript>
    <div class="noscript">
      <p><strong>这个页面需要一点点 JavaScript。</strong></p>
      <p>导航数据来自 <code>data/site.config.js</code>，请启用 JavaScript 后刷新。</p>
    </div>
  </noscript>

  <script src="./data/site.config.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
