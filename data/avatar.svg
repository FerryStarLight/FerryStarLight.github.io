<svg xmlns="http://www.w3.org/2000/svg" role="img" width="250" height="250" viewBox="0 0 250 250">
	
  <defs>
    <mask id="COutline">
      <rect x="-50" y="-50" width="300" height="300" fill="white" />
	  <circle cx="125" cy="125" fill="white" r="72" stroke="black" stroke-width="10" />
	  <rect x="-50" y="125" width="300" height="125" fill="white"/>
	  <ellipse cx="125" cy="125" rx="90" ry="20" fill="black" />
	</mask>
  </defs>
  
  <defs>
	<mask id="EOutline">
	  <rect x="0" y="0" width="250" height="250" fill="white" />
	  <ellipse cx="125" cy="125" rx="90" ry="20" stroke="black" stroke-width="15" fill="white" />
	  <rect x="-50" y="0" width="300" height="125" fill="white"/>
	</mask>
  </defs>

  <ellipse cx="125" cy="125" rx="110" ry="30" fill="#36ADFF"
	mask="url(#COutline)"
	transform="rotate(30 125 125)"
  />
  
  <circle cx="125" cy="125" r="70" mask="url(#EOutline)" fill="#36ADFF" transform="rotate(30 125 125)"/>
  
</svg>